---
name: Nx Affected Report 📝

on:
  pull_request:
    paths:
      - 'projects/**/*'
      - '.github/workflows/nx-report.yaml'
    branches:
      - master

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  Nx-affected:
    runs-on: ubuntu-latest
    steps:
      - name: 📀 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🖥️ Setup Env
        uses: ./.github/workflows/install

      - name: Get affected projects
        id: 'affected-projects'
        shell: bash
        # nx 23 prints this list as JSON; --json pins that instead of relying on the default
        run: echo "affected=$(pnpm exec nx show projects --affected --json)" >> "$GITHUB_OUTPUT"

      - name: Report affected over the PR
        uses: actions/github-script@v7
        env:
          AFFECTED: ${{ steps.affected-projects.outputs.affected }}
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const affectedProjects = JSON.parse(process.env.AFFECTED || '[]');

            let res = affectedProjects.map(p => `- ${p}`).join('\n');
            if (!affectedProjects.length || !res) {
                res = '### No affected projects have been found.';
            }

            const AFFECTED_PROJECTS_HEADER = '## 📝 Nx Affected Report';
            const body = [AFFECTED_PROJECTS_HEADER, res].join('\n');

            // get last comment
            const comments = await github.rest.issues.listComments({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo
            });

            // find comments to delete
            const commentsToDelete = comments.data.filter((comment) =>
                comment.body.startsWith(AFFECTED_PROJECTS_HEADER)
            );

            // delete comments
            const prms = commentsToDelete.map((comment) =>
                github.rest.issues.deleteComment({
                    comment_id: comment.id,
                    owner: context.repo.owner,
                    repo: context.repo.repo
                })
            );

            await Promise.all(prms);

            // create new comment for release note
            github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
            });
